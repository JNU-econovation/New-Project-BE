name: Call On-Premises Deploy Workflow

on:
  push:
    branches:
      - dev

jobs:
  call-onprem-deploy:
    name: Call Infrastructure On-Premises Deploy
    uses: JNU-econovation/soop-infra/.github/workflows/onprem-deploy.yml@main
    with:
      # Repository information
      repository-name: ${{ github.event.repository.name }}
      git-ref: ${{ github.sha }}
      
      # Build configuration
      java-version: '21'
      gradle-build-command: './gradlew clean build -x test'
      jar-source-pattern: 'build/libs/*.jar'
      
      # Application configuration
      jar-name: 'NewProject-0.0.1-SNAPSHOT.jar'
      server-port: 8080
      deploy-path: '/home/deploy/soop/infra/backend/New-Project-BE/'
      
    secrets:
      # On-premises server credentials
      ONPREM_HOST: ${{ secrets.ONPREM_HOST }}
      ONPREM_USER: ${{ secrets.ONPREM_USER }}
      ONPREM_SSH_PASSWORD: ${{ secrets.ONPREM_SSH_PASSWORD }}
      ONPREM_SSH_PORT: ${{ secrets.ONPREM_SSH_PORT }}