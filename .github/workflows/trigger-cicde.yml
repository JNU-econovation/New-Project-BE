name: Trigger Infra CICD
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call Infra repo workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: JNU-econovation/Soop-Infra
          event-type: backend-dev
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "repoName": "${{ github.repository }}",
              "branchName": "${{ github.ref_name }}"
            }