name: Call AWS ECS Deploy Workflow

on:
  push:
    branches:
      - dev

jobs:
  call-aws-deploy:
    name: Call Infrastructure AWS Deploy
    uses: JNU-econovation/soop-infra/.github/workflows/aws-ecs-deploy.yml@main
    with:
      # Repository information
      repository-name: ${{ github.event.repository.name }}
      git-ref: ${{ github.sha }}
      
      # AWS configuration
      aws-region: ap-northeast-2
      ecr-repository: soop/dev-backend
      ecs-cluster: soop-dev-cluster
      ecs-service: soop-dev-bakend-test-service
      container-name: application
      
      # Build configuration
      dockerfile-path: ./Dockerfile
      build-context: .
      
      # Environment
      environment: production
      
    secrets:
      # AWS credentials
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      # Slack notification
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      # ECS Task Definition secrets (for environment variables)
      ECS_SECRETS: ${{ secrets.ECS_SECRETS }}