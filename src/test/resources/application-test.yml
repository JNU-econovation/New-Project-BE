# DB/Redis URL은 MySqlContainerSupport/MySqlRedisContainerSupport가 동적 주입.
# Testcontainers 미실행 시 부팅 실패가 의도된 동작.
#
# 스키마: 엔티티 기반 create-drop (운영 스키마의 source of truth도 엔티티)
# 시드: data-test.sql (운영 data.sql 미러 + 테스트 전용 추가 가능)
# 실행 순서: 공통 application.yml의 jpa.defer-datasource-initialization=true 덕분에
#            Hibernate DDL 생성 -> data-test.sql 순으로 실행됨. 이 설정 지우면 깨짐.
spring:
  task:
    scheduling:
      enabled: false
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
    hibernate:
      # create-drop이 아니라 create: 시작 시 스키마 생성하되, 종료 시 DROP하지 않는다.
      # Testcontainer는 통째로 버려지므로 종료 DROP은 무의미하고, Singleton 컨테이너 teardown과
      # 경쟁하며 'Communications link failure' 노이즈만 만든다.
      ddl-auto: create
  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: classpath:data-test.sql

app:
  startup-jobs:
    enabled: false

auth:
  login_success:
    base_uri: http://localhost:3000/test/login

weather:
  api:
    key: test-weather-key

coolsms:
  api:
    key: test-coolsms-key
    secret: test-coolsms-secret
    sender-number: "01012345678"
    sms-prefix: '[산결]'
    ttl: 180

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket
      default-profile-key: profile/default.png
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key

custom:
  jwt:
    access:
      expired-time: 3600
      secret-key: test-access-secret-key-test-access-secret-key
    refresh:
      expired-time: 1209600
      secret-key: test-refresh-secret-key-test-refresh-secret-key
  cors:
    allowed-origins:
      - http://localhost:3000

oauth:
  kakao:
    client-id: test-kakao-client-id
    uri:
      redirect-uri: http://localhost:3000/test/kakao/callback
  apple:
    client-id: test-apple-client-id
    iss: https://appleid.apple.com
