spring:
  application:
    name: NewProject
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
    defer-datasource-initialization: true
  cloud:
    openfeign:
      client:
        config:
          weatherClient:
            connectTimeout: 2000   # 연결(소켓) 수립까지 최대 2초
            readTimeout: 5000      # 요청 전송 후 응답 바디 읽기까지 최대 5초

weather:
  scheduler:
    # 초 분 시 일 월 요일
    cron: 0 0 * * * *

nickname:
  scheduler:
    cron: 0 0 * * * *
